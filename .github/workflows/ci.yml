name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # fixado para builds reprodutíveis (mesma versão usada no desenvolvimento)
          flutter-version: 3.47.9
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes (unitários, i18n, versão e fluxos de UI)
        run: flutter test --reporter expanded
