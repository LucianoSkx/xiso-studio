name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            squashfs-tools file curl

      - uses: subosito/flutter-action@v2
        with:
          # fixado para builds reprodutíveis (mesma versão usada no desenvolvimento)
          flutter-version: 3.47.9
          cache: true

      - name: Dependências do projeto
        run: flutter pub get

      - name: Testes
        run: flutter test

      - name: Gerar ELF único (AppImage)
        run: ./packaging/build-appimage.sh

      - name: Publicar no release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/XISO-Studio-x86_64.AppImage
          generate_release_notes: true
