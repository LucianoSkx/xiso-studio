<?xml version="1.0" encoding="UTF-8"?>
<!-- Candidato A: disco dividido em quatro lóbulos por um X vazado.
     O próprio "buraco" entre os lóbulos desenha o X. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#14181f"/>
      <stop offset="1" stop-color="#080a0e"/>
    </linearGradient>
    <linearGradient id="a-mint" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8CEE7A"/>
      <stop offset="0.55" stop-color="#52B043"/>
      <stop offset="1" stop-color="#2F7F3C"/>
    </linearGradient>
    <clipPath id="a-disc">
      <circle cx="256" cy="256" r="168"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="118" ry="118" fill="url(#a-bg)"/>

  <!-- disco -->
  <circle cx="256" cy="256" r="168" fill="url(#a-mint)"/>

  <!-- X vazado: recorta o disco em 4 lóbulos -->
  <g clip-path="url(#a-disc)" stroke="#0b0d11" stroke-width="52" stroke-linecap="butt">
    <path d="M 40 40 L 472 472"/>
    <path d="M 472 40 L 40 472"/>
  </g>

  <!-- aro fino para dar acabamento -->
  <circle cx="256" cy="256" r="168" fill="none"
          stroke="#0b0d11" stroke-opacity="0.55" stroke-width="8"/>
  <!-- núcleo -->
  <circle cx="256" cy="256" r="34" fill="#0b0d11"/>
  <circle cx="256" cy="256" r="34" fill="none" stroke="#8CEE7A" stroke-opacity="0.5" stroke-width="6"/>
</svg>
