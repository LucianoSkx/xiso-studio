<?xml version="1.0" encoding="UTF-8"?>
<!-- Candidato B (v2): monograma "XO" (XISO → X + O de disco). O par não se
     sobrepõe: o X fica inteiro e o O encosta nele, com a bandeja embaixo. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13171d"/>
      <stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="b-mark" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#9BF07F"/>
      <stop offset="0.5" stop-color="#52B043"/>
      <stop offset="1" stop-color="#2C7A38"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="118" ry="118" fill="url(#b-bg)"/>

  <!-- X -->
  <g stroke="url(#b-mark)" stroke-width="56" stroke-linecap="round">
    <path d="M 106 190 L 236 320"/>
    <path d="M 236 190 L 106 320"/>
  </g>

  <!-- O = disco -->
  <circle cx="366" cy="255" r="82" fill="none"
          stroke="url(#b-mark)" stroke-width="56"/>

  <!-- bandeja -->
  <rect x="106" y="386" width="342" height="24" rx="12" fill="#52B043" fill-opacity="0.9"/>
</svg>
