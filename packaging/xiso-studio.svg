<?xml version="1.0" encoding="UTF-8"?>
<!--
  XISO Studio — marca original.
  Conceito: um "X" chapado e grosso (XISO) sobre uma barra que representa a
  mídia/bandeja de uma imagem de disco. Só formas cheias, sem anéis finos nem
  brilhos, para continuar nítido de 16 a 512 px.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1e25"/>
      <stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CE26C"/>
      <stop offset="1" stop-color="#3FAE4A"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="512" height="512" rx="116" ry="116" fill="url(#bg)"/>
  <rect x="5" y="5" width="502" height="502" rx="112" ry="112"
        fill="none" stroke="#52B043" stroke-opacity="0.20" stroke-width="2"/>

  <!-- X -->
  <g stroke="url(#mint)" stroke-width="84" stroke-linecap="round">
    <path d="M 172 148 L 340 316"/>
    <path d="M 340 148 L 172 316"/>
  </g>

  <!-- barra: a mídia -->
  <rect x="146" y="366" width="220" height="34" rx="17" fill="#52B043"/>
</svg>
