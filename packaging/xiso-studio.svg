<?xml version="1.0" encoding="UTF-8"?>
<!-- Candidato C (v2): caixa isométrica de mídia com X na tampa.
     X escuro sobre a tampa clara (contraste alto), sem sombra solta,
     arestas enxutas — pensado para ler bem em 16-32 px. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a20"/>
      <stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="c-top" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#C9FFB8"/>
      <stop offset="1" stop-color="#79D966"/>
    </linearGradient>
    <linearGradient id="c-left" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#4AAE51"/>
      <stop offset="1" stop-color="#2B7C37"/>
    </linearGradient>
    <linearGradient id="c-right" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2E8440"/>
      <stop offset="1" stop-color="#17502E"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="118" ry="118" fill="url(#c-bg)"/>

  <!-- faces laterais -->
  <path d="M 84 214 L 256 300 L 256 414 L 84 328 Z" fill="url(#c-left)"/>
  <path d="M 428 214 L 256 300 L 256 414 L 428 328 Z" fill="url(#c-right)"/>

  <!-- tampa -->
  <path d="M 256 118 L 428 214 L 256 310 L 84 214 Z" fill="url(#c-top)"/>

  <!-- X na tampa, nos eixos isométricos -->
  <g stroke="#0c1015" stroke-width="40" stroke-linecap="round">
    <path d="M 202 172 L 310 256"/>
    <path d="M 310 172 L 202 256"/>
  </g>
</svg>
