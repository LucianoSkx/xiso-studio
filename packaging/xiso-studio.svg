<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a20"/>
      <stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.34" cy="0.28" r="0.82">
      <stop offset="0" stop-color="#9BF07F"/>
      <stop offset="0.45" stop-color="#52B043"/>
      <stop offset="1" stop-color="#0E5C10"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#52B043" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#52B043" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="xmark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDF6DC"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" ry="108"
        fill="none" stroke="#52B043" stroke-opacity="0.16" stroke-width="2"/>

  <!-- halo -->
  <circle cx="256" cy="256" r="212" fill="url(#glow)"/>

  <!-- esfera Xbox -->
  <circle cx="256" cy="256" r="164" fill="url(#ball)"/>
  <circle cx="256" cy="256" r="164" fill="none"
          stroke="#000000" stroke-opacity="0.22" stroke-width="4"/>

  <!-- X curvo, estilo logo Xbox -->
  <g stroke="url(#xmark)" stroke-width="58" stroke-linecap="round" fill="none">
    <path d="M 178 170 Q 258 258 334 342"/>
    <path d="M 334 170 Q 254 258 178 342"/>
  </g>

  <!-- brilho superior -->
  <ellipse cx="206" cy="150" rx="86" ry="44" fill="#FFFFFF" fill-opacity="0.10"
           transform="rotate(-32 206 150)"/>
</svg>
